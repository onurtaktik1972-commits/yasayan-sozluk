; PlatformIO ile derlemek isterseniz (Arduino IDE kullanıyorsanız bu dosyayı yok sayın).
; Klasör yapısı: bu dosyanın yanına src/ klasörü açıp .ino ve config.h'yi oraya koyun.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  fastled/FastLED@^3.7.0
  knolleary/PubSubClient@^2.8
