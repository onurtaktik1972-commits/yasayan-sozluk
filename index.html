<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c1712">
  <title>Yaşayan Sözlük</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="ust">
    <div>
      <p class="ust-alt">Mevlânâ ve Mesnevî'den ilham alan 50 kelime</p>
      <h1>Yaşayan Sözlük</h1>
      <div class="durum" id="durum" title="Işık bağlantısı">
        <span class="nokta"></span><span id="durumYazi">Bağlanıyor…</span>
      </div>
    </div>
    <input id="ara" type="search" placeholder="Kelime ara…" autocomplete="off" aria-label="Kelime ara">
  </header>

  <main>
    <ol id="liste" class="liste" aria-label="Kelimeler"></ol>
    <p id="bos" class="bos" hidden>Eşleşen kelime yok.</p>
  </main>

  <!-- Detay kartı -->
  <div id="perde" class="perde" hidden></div>
  <section id="detay" class="detay" role="dialog" aria-modal="true" aria-labelledby="dBaslik" hidden>
    <button class="kapat" id="kapat" aria-label="Kapat">✕</button>
    <div class="gorsel" id="gorselKap">
      <img id="dGorsel" alt="">
      <div class="gorsel-yedek" id="dGorselYedek" hidden></div>
      <p class="gorsel-yazi" id="dGorselYazi" lang="ar" dir="rtl"></p>
      <!-- Mevlânâ çerçevesi -->
      <div class="cerceve" aria-hidden="true">
        <svg class="kose k1" viewBox="0 0 60 60"><use href="#rozet"/></svg>
        <svg class="kose k2" viewBox="0 0 60 60"><use href="#rozet"/></svg>
        <svg class="kose k3" viewBox="0 0 60 60"><use href="#rozet"/></svg>
        <svg class="kose k4" viewBox="0 0 60 60"><use href="#rozet"/></svg>
        <svg class="sikke" viewBox="0 0 64 80"><use href="#sikke"/></svg>
      </div>
    </div>
    <div class="detay-ic">
      <div class="detay-ust">
        <div>
          <span class="no" id="dNo"></span>
          <h2 id="dBaslik"></h2>
        </div>
        <button class="ses" id="sesBtn" aria-label="Sesi dinle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4.7a.7.7 0 0 0-1.2-.5L6.4 7.6A1.4 1.4 0 0 1 5.4 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.4a1.4 1.4 0 0 1 1 .4l3.4 3.4a.7.7 0 0 0 1.2-.5z" fill="currentColor"/>
            <path class="dalga d1" d="M16 9a5 5 0 0 1 0 6"/>
            <path class="dalga d2" d="M19.4 18.4a9 9 0 0 0 0-12.8"/>
          </svg>
        </button>
      </div>
      <p class="arapca" id="dArapca" lang="ar" dir="rtl"></p>
      <div class="ilerleme"><span id="sesIlerleme"></span></div>
      <figure class="soz" id="sozKutu">
        <blockquote id="dSoz"></blockquote>
      </figure>
    </div>
  </section>

  <!-- Çerçeve süsleri -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="rozet" viewBox="0 0 60 60">
        <g transform="translate(30 30)">
          <rect x="-17" y="-17" width="34" height="34" fill="#1f8a7a" stroke="#e2c27d" stroke-width="2"/>
          <rect x="-17" y="-17" width="34" height="34" fill="#1f8a7a" stroke="#e2c27d" stroke-width="2" transform="rotate(45)"/>
          <circle r="9" fill="#0f2c3d" stroke="#e2c27d" stroke-width="2"/>
          <circle r="3.2" fill="#e2c27d"/>
        </g>
      </symbol>
      <symbol id="sikke" viewBox="0 0 64 80">
        <path d="M14 74 C10 50 12 22 20 10 C25 3 39 3 44 10 C52 22 54 50 50 74 Z" fill="#b08458" stroke="#e2c27d" stroke-width="2.5"/>
        <path d="M18 64 C30 61 34 61 46 64" stroke="#7a5432" stroke-width="2" fill="none"/>
        <rect x="8" y="72" width="48" height="7" rx="3" fill="#1f8a7a" stroke="#e2c27d" stroke-width="2"/>
      </symbol>
    </defs>
  </svg>

  <div id="bildirim" class="bildirim" role="status" aria-live="polite"></div>

  <!-- Test modu: sanal LED şeridi (ESP32 yerine) -->
  <footer id="serit" class="serit" hidden>
    <div class="serit-baslik">Sanal LED şeridi <small id="seritBilgi"></small></div>
    <div class="ledler" id="ledler"></div>
  </footer>

  <script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
